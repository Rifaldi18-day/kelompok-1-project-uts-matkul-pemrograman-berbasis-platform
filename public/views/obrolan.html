<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrolan - Kelompok 1 TI25G</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="obrolan">
  <div class="app-shell">
    <div class="aero-window">
      <div class="window-titlebar">
        <div class="titlebar-left">
          <span class="orb-icon orb-orange">💬</span>
          <span>Kelompok 1 TI25G — /obrolan</span>
        </div>
        <div class="window-controls">
          <div class="win-btn win-min">_</div>
          <div class="win-btn win-max">□</div>
          <button type="button" id="logoutBtn" class="win-btn win-close">✕</button>
        </div>
      </div>

      <nav class="aero-navbar">
        <div class="nav-links">
          <a href="/beranda" class="gel-pill">🏠 Beranda</a>
          <a href="/anggota" class="gel-pill">👥 Anggota</a>
          <a href="/matkul" class="gel-pill">📚 Mata Kuliah</a>
          <a href="/obrolan" class="gel-pill active-nav">💬 Obrolan</a>
          <a href="/identitas" class="gel-pill">🪪 Identitas</a>
          <a href="/profil" class="gel-pill">⚙️ Profil</a>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div id="liveClockWidget" class="wmp-status-box">● CONNECTED</div>
          <a href="/profil" id="navUserChip" class="gel-pill" style="padding:5px 12px;"></a>
        </div>
      </nav>

      <div class="window-body">
        <div class="chat-layout">
          <div class="aero-card" style="padding:13px;">
            <div class="section-bar" style="font-size:0.86rem;">
              <span>📡 Room Chat</span>
            </div>
            <div id="chatRoomsList"></div>
          </div>

          <div class="aero-card" style="display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <div class="section-bar">
                <span id="activeRoomTitle">Grup Kelompok 1 (TI25G)</span>
                <span class="retro-bevel-box" style="font-size:0.72rem;">WS LIVE</span>
              </div>
              <div id="chatMessagesBox" class="chat-messages-box"></div>
            </div>

            <div>
              <div id="emojiPickerPanel" class="emoji-picker-panel"></div>
              <form id="chatForm" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;">
                <button type="button" id="toggleEmojiBtn" class="gel-pill" style="padding:8px 12px;">😊</button>
                <button type="button" id="uploadPhotoBtn" class="gel-pill" style="padding:8px 12px;">🖼️</button>
                <button type="button" id="openCameraBtn" class="gel-pill gel-pill-orange" style="padding:8px 12px;">📸</button>
                <input type="file" id="chatImageFile" accept="image/*" style="display:none;">
                <input type="text" id="chatInput" class="aero-input" placeholder="Tulis pesan..." style="flex:1;min-width:170px;">
                <button type="submit" class="gel-pill gel-pill-lime">Kirim ➤</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="cameraModal" class="camera-modal">
    <div class="aero-window" style="max-width:460px;width:100%;">
      <div class="window-titlebar">
        <div class="titlebar-left"><span>📸 Kamera</span></div>
        <button type="button" id="closeCameraBtn" class="win-btn win-close">✕</button>
      </div>
      <div class="window-body" style="text-align:center;">
        <video id="webcamVideo" autoplay playsinline style="width:100%;border-radius:12px;border:2px solid #fff;background:#000;"></video>
        <canvas id="webcamCanvas" style="display:none;"></canvas>
        <div style="margin-top:12px;">
          <button type="button" id="capturePhotoBtn" class="gel-pill gel-pill-lime">📸 Ambil & Kirim</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
